[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rashkar"
version = "0.1.0"
description = "Cloud-based climate-smart agriculture decision-support platform for India"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Rashkar Engineering Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "xarray>=2024.1.0",
    "netCDF4>=1.6.5",
    "scipy>=1.12.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=5.0.2",
    "celery>=5.3.6",
    "pytz>=2024.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "black>=24.2.0",
    "flake8>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
