name: Rashkar CI

on:
  push:
    branches: [ master, main, "yeild-and-heat-risk-feature" ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: testing
          USE_CROPNET_MOCK: "true"
        run: |
          python -m pytest backend/tests/ -v

  flutter-web-test:
    name: Flutter Web Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd flutter_client
          flutter pub get

      - name: Run Flutter Analyze
        run: |
          cd flutter_client
          flutter analyze --no-fatal-infos

      - name: Run Flutter Widget Tests
        run: |
          cd flutter_client
          flutter test

      - name: Build Flutter Web Release
        run: |
          cd flutter_client
          flutter build web --release --dart-define=API_BASE_URL=http://127.0.0.1:8000
